name: omega-discovery-02-certify-h4b
on:
  push:
    branches: ["omega/discovery-02-cpython-anext"]
    paths:
      - ".github/workflows/omega-discovery-02-certify-h4b.yml"
  workflow_dispatch:
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: parent
            sha: 8df6f077115484361b40952751fb7d703843c192
            patch: "no"
          - label: affected
            sha: 0a6c1ed34118b091230ee38fc047bcc2df8e5c5e
            patch: "no"
          - label: h4b
            sha: 0a6c1ed34118b091230ee38fc047bcc2df8e5c5e
            patch: "yes"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {path: omega}
      - run: |
          git clone --filter=blob:none https://github.com/python/cpython.git cpython
          cd cpython
          git checkout ${{ matrix.sha }}
      - name: Apply H4b
        if: matrix.patch == 'yes'
        working-directory: cpython
        run: python3 ../omega/omega/discovery02/apply_h4b.py
      - name: Build
        working-directory: cpython
        run: |
          ./configure --with-pydebug=no
          make -j2
      - name: L3 relevant tests
        run: ./cpython/python -m test test_asyncgen test_builtin test_coroutines -j1 | tee cert-${{ matrix.label }}-tests.log
      - name: L3 benchmark
        run: ./cpython/python omega/benchmarks/cpython_anext.py | tee cert-${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-cert-${{ matrix.label }}
          path: |
            cert-${{ matrix.label }}.json
            cert-${{ matrix.label }}-tests.log
          if-no-files-found: warn
