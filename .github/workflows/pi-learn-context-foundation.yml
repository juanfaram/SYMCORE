name: pi-learn-context-foundation
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/learning_state.py
      - experiments/self_improving_v03/pi_learn_value.py
      - experiments/self_improving_v03/vlearn_context_collector.py
      - experiments/self_improving_v03/pi_learn_contextual.py
      - experiments/self_improving_v03/test_pi_learn_context.py
      - .github/workflows/pi-learn-context-foundation.yml
  workflow_dispatch:
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q learning_state.py pi_learn_value.py vlearn_context_collector.py pi_learn_contextual.py
      - name: Context and value invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_pi_learn_context.py
