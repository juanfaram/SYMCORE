name: metro-phase4b-real-host-evidence
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/METRO_PHASE4B_PREREGISTRATION.py
      - experiments/self_improving_v03/metro_real_host.py
      - experiments/self_improving_v03/metro_phase4b.py
      - experiments/self_improving_v03/test_metro_phase4b.py
      - .github/workflows/metro-phase4b-real-host-evidence.yml
  workflow_dispatch:
jobs:
  metro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest ucimlrepo pandas
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q METRO_PHASE4B_PREREGISTRATION.py metro_real_host.py metro_phase4b.py real_cost_meter.py
      - name: Frozen preregistration invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_metro_phase4b.py
      - name: Independent external Metro replication
        working-directory: experiments/self_improving_v03
        run: python metro_phase4b.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: metro-phase4b-real-host-evidence
          path: experiments/self_improving_v03/artifacts/metro_phase4b_report.json
