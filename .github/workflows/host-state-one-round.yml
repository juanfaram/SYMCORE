name: host-state-one-round
on:
  workflow_dispatch:
  push:
    branches: [experiment/self-improving-v0.1]
    paths:
      - "experiments/self_improving_v03/host_state.py"
      - "experiments/self_improving_v03/host_state_predictive.py"
      - ".github/workflows/host-state-one-round.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python experiment_runner.py host-state-predictive python host_state_predictive.py
        working-directory: experiments/self_improving_v03
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: host-state-evidence
          path: experiments/self_improving_v03/artifacts/
