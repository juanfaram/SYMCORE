name: online-learning-instrument
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/online_continuous_learning.py
      - experiments/self_improving_v03/test_online_continuous_learning.py
      - experiments/self_improving_v03/online_longitudinal_instrument.py
      - experiments/self_improving_v03/online_phase1_validation.py
      - .github/workflows/online-learning-instrument.yml

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: |
          python -m compileall -q online_continuous_learning.py
          python -m compileall -q online_longitudinal_instrument.py
          python -m compileall -q online_phase1_validation.py
      - name: Online invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_online_continuous_learning.py
      - name: Longitudinal instrument
        working-directory: experiments/self_improving_v03
        run: python online_longitudinal_instrument.py
      - name: Phase-1 positive negative multi-seed controls
        working-directory: experiments/self_improving_v03
        run: python online_phase1_validation.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: online-learning-instrument
          path: |
            experiments/self_improving_v03/artifacts/online_instrument_report.json
            experiments/self_improving_v03/artifacts/online_phase1_report.json
