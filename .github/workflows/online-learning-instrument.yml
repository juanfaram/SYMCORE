name: online-learning-instrument
on:
  workflow_dispatch:
  push:
    branches: [experiment/self-improving-v0.1]
    paths:
      - "experiments/self_improving_v03/online_continuous_learning.py"
      - "experiments/self_improving_v03/test_online_continuous_learning.py"
      - "experiments/self_improving_v03/online_longitudinal_instrument.py"
      - ".github/workflows/online-learning-instrument.yml"
jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q online_continuous_learning.py online_longitudinal_instrument.py
        working-directory: experiments/self_improving_v03
      - name: Online invariants
        run: python -m pytest -q test_online_continuous_learning.py
        working-directory: experiments/self_improving_v03
      - name: Longitudinal instrument
        run: python online_longitudinal_instrument.py
        working-directory: experiments/self_improving_v03
      - uses: actions/upload-artifact@v5
        with:
          name: online-learning-instrument
          path: experiments/self_improving_v03/artifacts/online_instrument_report.json
