name: online-phase3-adversarial-evidence
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/online_phase3_adversarial.py
      - experiments/self_improving_v03/test_online_phase3_adversarial.py
      - .github/workflows/online-phase3-adversarial-evidence.yml
  workflow_dispatch:
jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q online_phase3_adversarial.py
      - name: Preregistered adversarial invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_online_phase3_adversarial.py
      - name: Adversarial matrix
        working-directory: experiments/self_improving_v03
        run: python online_phase3_adversarial.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: online-phase3-adversarial-evidence
          path: experiments/self_improving_v03/artifacts/online_phase3_adversarial_report.json
