name: omega-discovery-02-t5
on:
  push:
    branches: ["omega/discovery-02-cpython-anext"]
    paths:
      - "omega/discovery02/apply_t5.py"
      - ".github/workflows/omega-discovery-02-t5.yml"
  workflow_dispatch:
jobs:
  t5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {path: omega}
      - run: |
          git clone --filter=blob:none https://github.com/python/cpython.git cpython
          cd cpython
          git checkout 0a6c1ed34118b091230ee38fc047bcc2df8e5c5e
      - name: Apply T5
        working-directory: cpython
        run: python3 ../omega/omega/discovery02/apply_t5.py
      - name: Build
        working-directory: cpython
        run: |
          ./configure --with-pydebug=no
          make -j2
      - name: L1 tests
        run: ./cpython/python -m test test_asyncgen test_builtin test_coroutines -j1 | tee t5-tests.log
      - name: L2 benchmark
        run: ./cpython/python omega/benchmarks/cpython_anext.py | tee t5-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-t5
          path: |
            t5-tests.log
            t5-benchmark.json
          if-no-files-found: warn
