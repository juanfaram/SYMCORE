name: geometry-necessity-destruction
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/geometry_necessity_destruction_run.py
      - experiments/self_improving_v03/necessity_destroy_geometry.py
      - experiments/self_improving_v03/vlearn_full_geometry_collector.py
      - experiments/self_improving_v03/GEOMETRY_PRUNING_CONTRACT.py
      - experiments/self_improving_v03/test_geometry_pruning_run.py
      - .github/workflows/geometry-necessity-destruction.yml
  workflow_dispatch:
jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest ucimlrepo pandas
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q geometry_necessity_destruction_run.py necessity_destroy_geometry.py vlearn_full_geometry_collector.py
      - name: Leakage guard
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_geometry_pruning_run.py
      - name: Necessity Destruction on opened hosts
        working-directory: experiments/self_improving_v03
        run: python geometry_necessity_destruction_run.py
      - name: Upload destruction evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: geometry-necessity-destruction
          path: experiments/self_improving_v03/artifacts/geometry_necessity_destruction.json
