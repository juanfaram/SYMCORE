name: bidirectional-evolution-engine
on:
  workflow_dispatch:
  push:
    branches: [experiment/self-improving-v0.1]
    paths:
      - "experiments/self_improving_v03/bidirectional_engine.py"
      - "experiments/self_improving_v03/test_bidirectional_engine.py"
      - "experiments/self_improving_v03/capability_lifecycle.py"
      - ".github/workflows/bidirectional-evolution.yml"
jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q .
        working-directory: experiments/self_improving_v03
      - name: Reversible evolution invariants
        run: pytest -q test_bidirectional_engine.py test_evolutionary_frontier.py
        working-directory: experiments/self_improving_v03
