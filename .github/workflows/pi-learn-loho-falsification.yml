name: pi-learn-loho-falsification
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/pi_learn.py
      - experiments/self_improving_v03/pi_learn_loho.py
      - experiments/self_improving_v03/test_pi_learn.py
      - .github/workflows/pi-learn-loho-falsification.yml
  workflow_dispatch:
jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q pi_learn.py pi_learn_loho.py
      - name: Policy invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_pi_learn.py
      - name: Leave-one-host-out falsification
        working-directory: experiments/self_improving_v03
        run: python pi_learn_loho.py
