name: meta-policy-630
on:
  workflow_dispatch:
  push:
    branches: [experiment/self-improving-v0.1]
    paths:
      - "experiments/self_improving_v03/hierarchical_meta_policy.py"
      - "experiments/self_improving_v03/meta_policy_630_benchmark.py"
      - "experiments/self_improving_v03/test_hierarchical_meta_policy.py"
      - ".github/workflows/meta-policy-630.yml"
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q hierarchical_meta_policy.py meta_policy_630_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Meta-policy invariants
        run: python -m pytest -q test_hierarchical_meta_policy.py
        working-directory: experiments/self_improving_v03
      - name: Frozen holdout
        run: python meta_policy_630_benchmark.py
        working-directory: experiments/self_improving_v03
      - uses: actions/upload-artifact@v5
        with:
          name: meta-policy-630
          path: experiments/self_improving_v03/artifacts/meta_policy_630_report.json
