name: phase4-real-host-evidence
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/PHASE4_PREREGISTRATION.py
      - experiments/self_improving_v03/phase4_real_host.py
      - experiments/self_improving_v03/test_phase4_real_host.py
      - .github/workflows/phase4-real-host-evidence.yml
  workflow_dispatch:
jobs:
  phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q PHASE4_PREREGISTRATION.py phase4_real_host.py
      - name: Frozen preregistration invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_phase4_real_host.py
      - name: Open real chronological holdout once
        working-directory: experiments/self_improving_v03
        run: python phase4_real_host.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase4-real-host-evidence
          path: experiments/self_improving_v03/artifacts/phase4_real_host_report.json
