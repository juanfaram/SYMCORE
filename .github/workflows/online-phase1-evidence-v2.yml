name: online-phase1-evidence-v2
on:
  push:
    branches:
      - experiment/self-improving-v0.1
    paths:
      - experiments/self_improving_v03/online_continuous_learning.py
      - experiments/self_improving_v03/test_online_continuous_learning.py
      - experiments/self_improving_v03/online_longitudinal_instrument.py
      - experiments/self_improving_v03/online_phase1_validation.py
      - .github/workflows/online-phase1-evidence-v2.yml
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile all phase-1 code
        working-directory: experiments/self_improving_v03
        run: python -m compileall -q online_continuous_learning.py online_longitudinal_instrument.py online_phase1_validation.py
      - name: Incremental-learning invariants
        working-directory: experiments/self_improving_v03
        run: python -m pytest -q test_online_continuous_learning.py
      - name: Longitudinal positive instrument
        working-directory: experiments/self_improving_v03
        run: python online_longitudinal_instrument.py
      - name: Negative positive multi-seed discrimination
        working-directory: experiments/self_improving_v03
        run: python online_phase1_validation.py
      - name: Upload phase-1 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: online-phase1-evidence-v2
          path: experiments/self_improving_v03/artifacts/
