name: legacy-research-smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/self_improving_v03/**"
concurrency:
  group: legacy-research-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install pytest
      - name: Compile research archive
        run: python -m compileall -q .
        working-directory: experiments/self_improving_v03
      - name: Unit tests only
        run: pytest -q
        working-directory: experiments/self_improving_v03
