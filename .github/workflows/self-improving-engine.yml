name: self-improving-engine
on:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m compileall -q .\n        working-directory: experiments/self_improving_v03\n      - run: pytest -q
        working-directory: experiments/self_improving_v03
      - run: python evaluate.py
        working-directory: experiments/self_improving_v03
      - run: python benchmark_specialists.py
        working-directory: experiments/self_improving_v03
      - run: python interaction_learner.py
        working-directory: experiments/self_improving_v03
      - run: python stress_interactions.py
        working-directory: experiments/self_improving_v03
      - run: python benchmark_mixture.py
        working-directory: experiments/self_improving_v03
      - run: python curriculum.py
        working-directory: experiments/self_improving_v03
      - run: python progress_gate.py\n        working-directory: experiments/self_improving_v03\n      - uses: actions/upload-artifact@v5
        with:
          name: evolution-v05
          path: experiments/self_improving_v03/artifacts/
