name: self-improving-engine
on:
  pull_request:
  push:
    branches:
      - experiment/self-improving-v0.1
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Static compile gate
        run: python -m compileall -q .
        working-directory: experiments/self_improving_v03
      - name: Unit and regression tests
        run: pytest -q
        working-directory: experiments/self_improving_v03
      - name: Evolution benchmark
        run: python evaluate.py
        working-directory: experiments/self_improving_v03
      - name: Specialist benchmark
        run: python benchmark_specialists.py
        working-directory: experiments/self_improving_v03
      - name: Interaction learning
        run: python interaction_learner.py
        working-directory: experiments/self_improving_v03
      - name: Distribution-shift stress
        run: python stress_interactions.py
        working-directory: experiments/self_improving_v03
      - name: Mixture benchmark
        run: python benchmark_mixture.py
        working-directory: experiments/self_improving_v03
      - name: Continual-learning curriculum
        run: python curriculum.py
        working-directory: experiments/self_improving_v03
      - name: Adversarial 20k interaction arena
        run: python adversarial_arena.py
        working-directory: experiments/self_improving_v03
      - name: Out-of-distribution arena
        run: python ood_arena.py
        working-directory: experiments/self_improving_v03
      - name: Multi-seed capability frontier tournament
        run: python frontier_tournament.py
        working-directory: experiments/self_improving_v03
      - name: Guarded specialist routing
        run: python benchmark_guarded_router.py
        working-directory: experiments/self_improving_v03
      - name: Skill resurrection and compositional OOD
        run: python resurrection_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Forward transfer benchmark
        run: python transfer_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Multi-seed meta-transfer
        run: python meta_transfer_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Cumulative transfer X plus Y to Z
        run: python cumulative_transfer_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Residual seasonal specialist
        run: python benchmark_residual.py
        working-directory: experiments/self_improving_v03
      - name: Real-data host control
        run: python real_host_control.py
        working-directory: experiments/self_improving_v03
      - name: Capability growth ledger
        run: python growth_report.py
        working-directory: experiments/self_improving_v03
      - name: Structural N-to-N-plus-1 growth
        run: python structural_growth_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: Permutation falsification of L(t)
        run: python L_permutation_test.py
        working-directory: experiments/self_improving_v03
      - name: Inflation falsification of G(t)
        run: python G_inflation_test.py
        working-directory: experiments/self_improving_v03
      - name: Independent ledger verification
        run: python standalone_ledger_verify.py artifacts/capability_ledger.jsonl
        working-directory: experiments/self_improving_v03
      - name: Directional transfer matrix
        run: python pairwise_transfer.py
        working-directory: experiments/self_improving_v03
      - name: Diagnose zero learning acceleration
        run: python L_causal_diagnosis.py
        working-directory: experiments/self_improving_v03
      - name: Cross-host portability contract
        run: python cross_host_benchmark.py
        working-directory: experiments/self_improving_v03
      - name: North-star scorecard
        run: python north_star_report.py
        working-directory: experiments/self_improving_v03
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evolution-evidence
          path: experiments/self_improving_v03/artifacts/
      - name: Hard progress gate
        run: python progress_gate.py
        working-directory: experiments/self_improving_v03
