name: self-improving-engine
on:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest -q
        working-directory: experiments/self_improving_v03
      - run: python main.py
        working-directory: experiments/self_improving_v03
      - uses: actions/upload-artifact@v4
        with:
          name: evolution-v03
          path: experiments/self_improving_v03/artifacts/evolution.json
