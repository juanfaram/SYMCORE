name: omega-lab
on:
  push:
    branches: ["omega/**"]
  pull_request:
  workflow_dispatch:
jobs:
  contract-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Contract tests
        id: contract
        run: pytest -q tests/test_contract.py | tee omega-contract.log
      - name: End-to-end benchmark
        if: success()
        run: python benchmarks/omega_end_to_end.py | tee omega-benchmark.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-evidence
          path: |
            omega-contract.log
            omega-benchmark.json
          if-no-files-found: ignore
