name: omega-lab
on:
  push:
    branches: ["omega/**"]
    paths:
      - "symcore/**"
      - "tests/**"
      - "benchmarks/**"
      - "requirements.txt"
      - ".github/workflows/omega-lab.yml"
  pull_request:
  workflow_dispatch:
jobs:
  contract-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU lab dependencies
        run: |
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Contract and adversarial tests
        run: pytest -q tests/test_contract.py tests/test_adversarial.py | tee omega-contract.log
      - name: Causal profile
        if: success()
        run: python benchmarks/profile_detection.py | tee omega-profile.txt
      - name: End-to-end benchmark
        if: success()
        run: python benchmarks/omega_end_to_end.py | tee omega-benchmark.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-evidence
          path: |
            omega-contract.log
            omega-profile.txt
            omega-benchmark.json
          if-no-files-found: ignore
